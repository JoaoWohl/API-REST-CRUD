name: tests
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:



jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: JavaSetup
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
      - name: TestProject
        run: mvn clean test